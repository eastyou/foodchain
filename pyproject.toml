[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foodchain"
version = "0.1.0"
description = "食物链：生态链查询、角色判断与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "science", "food-chain", "ecology", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
foodchain = "foodchain.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/foodchain"
Source = "https://github.com/eastyou/foodchain"

[tool.setuptools]
packages = ["foodchain"]
